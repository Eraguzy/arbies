name: listings-claude-replies

# '@claude' in a comment or review: claude rereads the PR, pushes commits to its branch and replies
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# one reply at a time per PR, so two comments don't push to the same branch at once
concurrency:
  group: listings-claude-replies-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  reply:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --effort max
            --append-system-prompt "On a pull request whose title starts with 'listings:', follow scripts/listings/daily-listings-prompt.md for every change, and update the PR body yourself. Reply in as few words as possible: one line per change, plus a question only when you can't decide. No todo list, no file list, no explanation of the rules."
            --allowedTools "Bash(curl:*),Bash(node:*),Bash(npm:*),Bash(gh pr view:*),Bash(gh pr edit:*)"
            --add-dir /tmp
