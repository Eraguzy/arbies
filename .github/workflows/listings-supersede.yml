name: listings-supersede

# closes the older 'listings:' PRs when a new one opens
on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  supersede:
    if: startsWith(github.event.pull_request.title, 'listings:')
    runs-on: ubuntu-latest
    steps:
      - name: Close older listings PRs
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PR: ${{ github.event.pull_request.number }}
        run: |
          older=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq ".[] | select((.title | startswith(\"listings:\")) and .number < $NEW_PR) | .number")
          for n in $older; do
            gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Superseded by #$NEW_PR"
          done
